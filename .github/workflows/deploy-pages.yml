name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "homepage-redesign/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the deployable site
        run: |
          mkdir _site
          rsync -a \
            --exclude='_*.frag.html' \
            --exclude='_artifact-preview.html' \
            --exclude='README.md' \
            --exclude='.htaccess' \
            homepage-redesign/ _site/
          touch _site/.nojekyll
          test -f _site/CNAME || echo "www.northwesttowncarservice.com" > _site/CNAME
          echo "Deploying $(find _site -type f | wc -l) files"

      # Enable Pages once, by hand: repo Settings -> Pages -> Source: "GitHub Actions".
      # enablement:true is omitted on purpose — the workflow's token can't create the
      # Pages site itself ("Resource not accessible by integration").
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
